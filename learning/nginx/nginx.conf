user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Anti-Reconnaissance: Hide server version and OS details
    server_tokens off;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Buffer Overflow & DoS Protection
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Logging format including upstream latency and real client IP
    log_format enterprise '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log enterprise;
    error_log /var/log/nginx/error.log warn;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zones (DDOS & Brute-Force Defense)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=drm_limit:10m rate=15r/s;
    limit_req_status 429;

    # Upstream Gunicorn Cluster
    upstream edukom_backend {
        server web:8000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP -> HTTPS Redirect
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name edukom.ng www.edukom.ng;

        # Allow Let's Encrypt ACME challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # Production HTTPS Server
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name edukom.ng www.edukom.ng;

        # TLS Cryptographic Hardening
        ssl_certificate /etc/nginx/ssl/edukom.crt;
        ssl_certificate_key /etc/nginx/ssl/edukom.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (Defense in Depth)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Content Security Policy (allows Daily.co WebRTC, Paystack, Flutterwave, and HLS.js streaming)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://js.paystack.co https://checkout.flutterwave.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.paystack.co https://api.flutterwave.com https://*.daily.co wss://*.daily.co; frame-src 'self' https://*.daily.co https://checkout.flutterwave.com; media-src 'self' blob: data:;" always;

        # Permissions Policy: restrict sensor access strictly to video classrooms
        add_header Permissions-Policy "camera=(self 'https://*.daily.co'), microphone=(self 'https://*.daily.co'), display-capture=(self 'https://*.daily.co'), geolocation=()" always;

        # ----------------------------------------------------------------------
        # Static Assets
        # ----------------------------------------------------------------------
        location /Assets/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
            access_log off;
        }

        location /media/ {
            alias /var/www/media/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # ----------------------------------------------------------------------
        # High-Risk Endpoints: Brute Force & Scraping Protection
        # ----------------------------------------------------------------------
        # Account Login Rate Limiting (5 requests / min per IP)
        location /account/Login {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://edukom_backend;
            include /etc/nginx/proxy_params;
        }

        # DRM Key Exchange Rate Limiting (15 requests / sec per IP)
        location /video/drm-key/ {
            limit_req zone=drm_limit burst=20 nodelay;
            proxy_pass http://edukom_backend;
            include /etc/nginx/proxy_params;
        }

        # ----------------------------------------------------------------------
        # Health & Monitoring Probes (Direct passthrough with zero caching)
        # ----------------------------------------------------------------------
        location ~ ^/(healthz|readyz)/ {
            proxy_pass http://edukom_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # ----------------------------------------------------------------------
        # General Application Reverse Proxy
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://edukom_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
