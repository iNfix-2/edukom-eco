name: Edukom Enterprise DevSecOps Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.12'
  DJANGO_SETTINGS_MODULE: 'edukom.settings'
  SECRET_KEY: 'ci-temporary-cryptographically-secure-key-for-test-runner-only'
  DEBUG: 'False'
  ALLOWED_HOSTS: '127.0.0.1,localhost,testserver'
  PAYSTACK_SECRET_KEY: 'sk_test_mock_paystack_key'
  FLUTTERWAVE_SECRET_KEY: 'flw_mock_secret_key'
  DAILY_API_KEY: 'daily_mock_api_key'

jobs:
  # ============================================================================
  # 1. Automated Unit Testing & Django Security Check
  # ============================================================================
  test:
    name: Run Automated Test Suite & Django Deployment Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Deployment Security Check
        run: |
          python manage.py check --deploy

      - name: Execute Full 52-Test Verification Suite
        run: |
          python manage.py test payments payroll classroom videolibrary automations edukom.tests_health --verbosity=2

  # ============================================================================
  # 2. Dependency Vulnerability & Secret Scanning
  # ============================================================================
  security-audit:
    name: Security Vulnerability & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan Dependencies for Known CVEs (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc || echo "Completed pip-audit review."

      - name: Scan Repository for Committed Secrets & API Keys (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # 3. Docker Image Build & Trivy Container Scan
  # ============================================================================
  docker-scan:
    name: Build Multi-Stage Docker Image & Scan for OS CVEs
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: edukom-lms:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'edukom-lms:ci-${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
