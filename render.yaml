# ==============================================================================
# Edukom Enterprise LMS - Render Blueprint Configuration
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: edukom-lms
    runtime: python
    rootDir: learning
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn edukom.wsgi:application --forwarded-allow-ips='*'"
    healthCheckPath: "/healthz/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@edukom.ng"
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      # If using Render's free PostgreSQL, connect automatically:
      - key: DATABASE_URL
        fromDatabase:
          name: edukom-lms-db
          property: connectionString

databases:
  - name: edukom-lms-db
    plan: free
    region: frankfurt
    databaseName: edukom_lms
    user: edukom_admin
